<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>إنشاء حساب — المساعد الذكي</title>
<link rel="stylesheet" href="css/style.css">
<script>
  (function() {
    const savedTheme = localStorage.getItem('theme') || 'dark';
    if (savedTheme === 'light') document.documentElement.classList.add('light-theme');
    const savedLang = localStorage.getItem('lang') || 'ar';
    if (savedLang === 'en') {
      document.documentElement.lang = 'en';
      document.documentElement.dir = 'ltr';
    }
  })();
</script>
</head>
<body>

<div class="auth-nav">
  <div class="lang-toggle" id="langToggle">
    <button class="lang-btn is-active" data-lang="ar">عربي</button>
    <button class="lang-btn" data-lang="en">EN</button>
  </div>
  <button class="theme-toggle" id="themeToggle" title="تبديل المظهر / Toggle Theme" aria-label="تبديل المظهر">
    <svg class="sun-icon" width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><circle cx="12" cy="12" r="4"/><path d="M12 2v2M12 20v2M4.93 4.93l1.41 1.41M17.66 17.66l1.41 1.41M2 12h2M20 12h2M6.34 17.66l-1.41 1.41M19.07 4.93l-1.41 1.41"/></svg>
    <svg class="moon-icon" width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" style="display:none;"><path d="M12 3a6 6 0 0 0 9 9 9 9 0 1 1-9-9Z"/></svg>
  </button>
</div>

<div class="auth-screen">

  <svg class="auth-watermark" viewBox="0 0 200 200" preserveAspectRatio="xMidYMid slice" xmlns="http://www.w3.org/2000/svg">
    <defs>
      <pattern id="khatam1" width="50" height="50" patternUnits="userSpaceOnUse">
        <rect x="5" y="5" width="40" height="40" fill="none" stroke="#e8a33d" stroke-width="0.6" stroke-opacity="0.32"/>
        <rect x="5" y="5" width="40" height="40" fill="none" stroke="#e8a33d" stroke-width="0.6" stroke-opacity="0.32" transform="rotate(45 25 25)"/>
      </pattern>
      <radialGradient id="fade1" cx="50%" cy="0%" r="75%">
        <stop offset="0%" stop-color="#000" stop-opacity="0"/>
        <stop offset="100%" stop-color="#000" stop-opacity="0.9"/>
      </radialGradient>
    </defs>
    <rect width="200" height="200" fill="url(#khatam1)"/>
    <rect width="200" height="200" fill="url(#fade1)"/>
  </svg>

  <div class="auth-card">

      <div class="auth-card__head">
        <h2>يلا نبدأ</h2>
        <p>عندك حساب؟ <a href="signin.html">سجّل دخول من هنا</a></p>
      </div>

      <div class="form-banner" id="formBanner"></div>

      <form id="signupForm" novalidate>

        <div class="field" id="field-username">
          <label for="username">اسم المستخدم</label>
          <div class="input-wrap">
            <input type="text" id="username" name="username" placeholder="مثلاً: sara_dev" autocomplete="username">
          </div>
          <p class="field-hint" id="hint-username">من 3 لـ 20 حرف، من غير مسافات</p>
        </div>

        <div class="field" id="field-email">
          <label for="email">البريد الإلكتروني</label>
          <div class="input-wrap">
            <input type="email" id="email" name="email" placeholder="you@example.com" autocomplete="email">
          </div>
          <p class="field-hint" id="hint-email"></p>
        </div>

        <div class="field" id="field-password">
          <label for="password">كلمة المرور</label>
          <div class="input-wrap">
            <input type="password" id="password" name="password" placeholder="8 أحرف على الأقل" autocomplete="new-password">
            <button type="button" class="toggle-pw" data-target="password" aria-label="إظهار كلمة المرور">
              <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8"><path d="M1 12s4-7 11-7 11 7 11 7-4 7-11 7-11-7-11-7z"/><circle cx="12" cy="12" r="3"/></svg>
            </button>
          </div>
          <div class="pw-strength" id="pwStrength">
            <i></i><i></i><i></i><i></i>
          </div>
          <p class="field-hint" id="hint-password">لازم تحتوي على حرف ورقم على الأقل</p>
        </div>

        <div class="field" id="field-confirm">
          <label for="confirm">تأكيد كلمة المرور</label>
          <div class="input-wrap">
            <input type="password" id="confirm" name="confirm" placeholder="اكتب كلمة المرور تاني" autocomplete="new-password">
          </div>
          <p class="field-hint" id="hint-confirm"></p>
        </div>

        <button type="submit" class="btn-primary" id="submitBtn">إنشاء الحساب</button>
      </form>

  </div>

</div>

<script src="js/storage.js"></script>
<script src="js/validators.js"></script>
<script src="js/signup.js"></script>
</body>
</html>
